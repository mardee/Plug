name: Build Plugins (Windows & macOS)

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (x64)"
            os: windows-latest
            artifact_name: "ozoPRISM-Windows-x64"

          - name: "macOS (Universal)"
            os: macos-latest
            artifact_name: "ozoPRISM-macOS-Universal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-9.0.2-${{ runner.os }}

      - name: Clone JUCE 9.0.2
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch 9.0.2 --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      # -------------------------------------------------------------
      # Windows 环境准备与配置
      # -------------------------------------------------------------
      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      # -------------------------------------------------------------
      # macOS 配置 (Universal Binary: arm64 + x86_64)
      # -------------------------------------------------------------
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      # -------------------------------------------------------------
      # 编译
      # -------------------------------------------------------------
      - name: Build ozoPRISM
        run: |
          cmake --build build --config Release --target ozoPRISM --parallel

      # -------------------------------------------------------------
      # 打包 Windows 产物 (VST3 & Standalone exe)
      # -------------------------------------------------------------
      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/Windows
          
          echo "=== Searching for build outputs ==="
          find build -name "*PRISM*.vst3" -o -name "*PRISM*.exe"

          # 拷贝 VST3 Bundle
          find build -type d -name "*PRISM*.vst3" -exec cp -r {} dist/Windows/ \;
          # 拷贝 Standalone .exe
          find build -type f -name "*PRISM*.exe" -exec cp {} dist/Windows/ \;
          # 拷贝说明文档
          if [ -f "INSTALL.txt" ]; then
            cp "INSTALL.txt" dist/Windows/
          fi
          
          echo "=== Contents in dist/Windows ==="
          ls -la dist/Windows/
          
          cd dist/Windows
          7z a -tzip ../../${{ matrix.artifact_name }}.zip ./*

      # -------------------------------------------------------------
      # 打包 macOS 产物 (AU, VST3, Standalone app) 并进行 ad-hoc 签名
      # -------------------------------------------------------------
      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/macOS
          
          echo "=== Searching for macOS build outputs ==="
          find build -name "*PRISM*.component" -o -name "*PRISM*.vst3" -o -name "*PRISM*.app"

          # 拷贝 AU
          find build -type d -name "*PRISM*.component" -exec cp -R {} dist/macOS/ \;
          # 拷贝 VST3
          find build -type d -name "*PRISM*.vst3" -exec cp -R {} dist/macOS/ \;
          # 拷贝 Standalone app
          find build -type d -name "*PRISM*.app" -exec cp -R {} dist/macOS/ \;
          # 拷贝说明文档
          if [ -f "INSTALL.txt" ]; then
            cp "INSTALL.txt" dist/macOS/
          fi

          # 对所有 bundle 执行本地签名，防止损坏误报
          echo "=== Signing macOS bundles ==="
          find dist/macOS -type d -name "*.app" -o -name "*.component" -o -name "*.vst3" | while read -r bundle; do
            echo "Signing $bundle"
            codesign --force --deep --sign - "$bundle" || true
          done

          echo "=== Contents in dist/macOS ==="
          ls -la dist/macOS/

          cd dist/macOS
          zip -r -y ../../${{ matrix.artifact_name }}.zip ./*

      # -------------------------------------------------------------
      # 上传 GitHub Actions 构建产物
      # -------------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

      # -------------------------------------------------------------
      # 若打了 release tag (如 v1.1.0)，自动发布到 GitHub Release
      # -------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
