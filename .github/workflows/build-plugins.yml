name: Build Plugins (Windows & macOS)

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows (x64)"
            os: windows-latest
            artifact_name: "ozoPRISM-Windows-x64"

          - name: "macOS (Universal)"
            os: macos-latest
            artifact_name: "ozoPRISM-macOS-Universal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-9.0.2-${{ runner.os }}

      - name: Clone JUCE 9.0.2
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --branch 9.0.2 --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Setup MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build ozoPRISM
        run: |
          cmake --build build --config Release --target ozoPRISM --parallel

      # -------------------------------------------------------------
      # 打包 Windows 产物
      # -------------------------------------------------------------
      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/Windows
          # 拷贝 VST3
          if [ -d "build/ozoPRISM_artefacts/Release/VST3" ]; then
            cp -r "build/ozoPRISM_artefacts/Release/VST3" dist/Windows/
          fi
          # 拷贝 Standalone
          if [ -d "build/ozoPRISM_artefacts/Release/Standalone" ]; then
            cp -r "build/ozoPRISM_artefacts/Release/Standalone" dist/Windows/
          fi
          # 拷贝说明文件
          if [ -f "INSTALL.txt" ]; then
            cp "INSTALL.txt" dist/Windows/
          fi
          
          cd dist/Windows
          7z a -tzip ../../${{ matrix.artifact_name }}.zip *

      # -------------------------------------------------------------
      # 打包 macOS 产物
      # -------------------------------------------------------------
      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/macOS
          # 拷贝 AU
          if [ -d "build/ozoPRISM_artefacts/Release/AU" ]; then
            cp -r "build/ozoPRISM_artefacts/Release/AU" dist/macOS/
          fi
          # 拷贝 VST3
          if [ -d "build/ozoPRISM_artefacts/Release/VST3" ]; then
            cp -r "build/ozoPRISM_artefacts/Release/VST3" dist/macOS/
          fi
          # 拷贝 Standalone
          if [ -d "build/ozoPRISM_artefacts/Release/Standalone" ]; then
            cp -r "build/ozoPRISM_artefacts/Release/Standalone" dist/macOS/
          fi
          # 拷贝说明文件
          if [ -f "INSTALL.txt" ]; then
            cp "INSTALL.txt" dist/macOS/
          fi

          cd dist/macOS
          zip -r -y ../../${{ matrix.artifact_name }}.zip ./*

      # -------------------------------------------------------------
      # 上传 GitHub Actions 构建产物 (在 Actions 页面直接下载)
      # -------------------------------------------------------------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

      # -------------------------------------------------------------
      # 若打了 release tag (如 v1.1.0)，自动发布到 GitHub Release
      # -------------------------------------------------------------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
