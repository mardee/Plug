name: Build PRISM

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-plugins.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'src/**'
      - 'assets/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'INSTALL.txt'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        default: windows
        options:
          - windows
          - macos
          - both
      package:
        description: 'vst3 = quick test package; full = all formats + audio tests'
        type: choice
        default: vst3
        options:
          - vst3
          - full

permissions:
  contents: read

# Do not cancel a full build when a quick build is requested, or cancel a release.
concurrency:
  group: prism-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'auto' }}-${{ inputs.package || 'auto' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  JUCE_VERSION: '9.0.2'

jobs:
  plan:
    name: Select build and check packaging
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test build selection and packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Select platforms and JUCE wrapper targets
        id: select
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: python3 scripts/ci_plan.py

  build:
    name: ${{ matrix.artifact }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: prism-${{ matrix.os }}-juce9-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging on this platform
        run: python -B -m unittest discover -s tests -p 'test_package_plugins.py' -v
      - name: Set build parallelism
        run: |
          python -c 'import os; print("CMAKE_BUILD_PARALLEL_LEVEL=" + str(os.cpu_count() or 2))' >> "$GITHUB_ENV"

      - name: Restore JUCE source
        id: juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-source-${{ env.JUCE_VERSION }}-${{ runner.os }}
      - name: Download JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        run: git clone --branch "$JUCE_VERSION" --depth 1 https://github.com/juce-framework/JUCE.git JUCE

      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Windows compiler cache
        if: runner.os == 'Windows'
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=${{ matrix.tests }} \
            -DPRISM_BUILD_SNAPSHOT=OFF
      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_TESTING=${{ matrix.tests }} \
            -DPRISM_BUILD_SNAPSHOT=OFF

      - name: Build plugin binaries
        env:
          BUILD_TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$BUILD_TARGETS"
          cmake --build build --config Release --target "${targets[@]}" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Run audio regression and VST3 load tests
        if: matrix.package == 'full'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Package and verify binaries
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_KIND: ${{ matrix.package }}
        run: |
          python scripts/package_plugins.py \
            --platform "$PACKAGE_PLATFORM" --package "$PACKAGE_KIND" \
            --build-dir build --output-dir dist --commit "$GITHUB_SHA"
      - name: Report compiler cache
        if: always() && steps.sccache.outcome == 'success'
        run: |
          sccache --show-stats
          sccache --show-stats >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ozoPRISM-*-full
          merge-multiple: true
          path: dist
      - name: Publish verified Windows and macOS packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
